[package]
name = "rag-loader"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros"] }
pgvector = { version = "0.4", features = ["sqlx"] }

dotenvy = "0.15"
anyhow = "1"

# Dependencias para procesar PDF y embeddings en Rust:
lopdf = "0.44"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
hf-hub = { version = "1.0.0", features = ["blocking"] }

# Barra de progreso para consola
indicatif = { version = "0.18", features = ["tokio"] }

tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
