[package]
name = "embedder"
version = "0.1.0"
edition = "2021"
description = "Genera embeddings de texto en el navegador (BERT-style) via Candle + wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Candle sin backends nativos (cuda/mkl) — solo CPU, apto para wasm.
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }

tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2.15", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
